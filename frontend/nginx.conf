# ---------------------------------------------------------------------------
# Production reverse proxy + SPA host for the Treasury frontend.
#
# In dev the Vite server proxies /api -> http://localhost:8080. In prod nginx
# does the same job: it serves the built SPA and forwards /api to the backend
# container. The frontend calls the API via the relative path /api/v1, so this
# proxy is what makes API requests reach the backend.
# MUST stay LF-only (see .gitattributes).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Invoice/file uploads — keep in sync with UPLOAD_MAX_SIZE_MB (10 MB) + headroom.
    client_max_body_size 20m;

    # Reverse-proxy the API to the backend service. Using Docker's embedded DNS
    # (127.0.0.11) with a variable forces per-request resolution, so the proxy
    # survives a backend container restart getting a new IP.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OCR recognition calls evo-ai and can take ~30s+; don't cut them short.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # SPA fallback: every non-asset route resolves to index.html (client routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
